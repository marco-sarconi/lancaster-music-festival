<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEEDF3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#120E1C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="LMF 2026">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>LMF 2026 Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Big+Shoulders+Display:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: a pocket running order. Hour blocks are printed sheets of rows; poster numerals carry the time; one red-rose accent marks your picks. */
:root{
  --bg:#EEEDF3;        /* pale slate paper, biased toward the ink */
  --surface:#FFFFFF;
  --ink:#1C1630;       /* night plum ink */
  --muted:#5F5975;
  --line:#DCD9E6;
  --rose:#C8173B;      /* Lancashire red rose */
  --rose-soft:#FBE6EB;
  --gold:#E0A100;      /* stage light: on now */
  --gold-soft:#FFF3D1;
  --join:#1E7A58; --join-soft:#DDF2E8;
  --on-rose:#FFFFFF;
  --display:"Big Shoulders Display", "Avenir Next Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120E1C; --surface:#1D1729; --ink:#F1EDF8; --muted:#A79FBC; --line:#2F2742;
    --rose:#FF5872; --rose-soft:#3A1828; --gold:#FFC23D; --gold-soft:#382B10; --join:#5BD3A3; --join-soft:#15322A; --on-rose:#1A0710;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120E1C; --surface:#1D1729; --ink:#F1EDF8; --muted:#A79FBC; --line:#2F2742;
  --rose:#FF5872; --rose-soft:#3A1828; --gold:#FFC23D; --gold-soft:#382B10; --join:#5BD3A3; --join-soft:#15322A; --on-rose:#1A0710;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;min-height:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:8px 16px 6px;border-bottom:1px solid var(--line);transition:transform .22s ease-out}
body.hide-hdr header.top{transform:translateY(calc(-100% - env(safe-area-inset-top,0px)))}
@media (prefers-reduced-motion:reduce){header.top{transition:none}}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand h1{font-family:var(--display);font-weight:800;font-size:19px;line-height:1;margin:0;letter-spacing:-.01em}
.brand h1 span{color:var(--rose)}
.brand small{color:var(--muted);font-size:12px}
.search{margin-top:7px;position:relative}
.search input{width:100%;padding:8px 40px 8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:16px}
.search input:focus{border-color:var(--rose);outline:none}
.search .clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:32px;height:32px;font-size:20px;color:var(--muted);display:none}
.search.has .clear{display:block}
.days{display:flex;gap:6px;overflow-x:auto;margin:7px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:4px 10px;text-align:center;position:relative}
.day b{display:block;font-family:var(--display);font-size:16px;line-height:1.1;white-space:nowrap}
.day.today::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--rose)}
.day i{font-style:normal;font-size:11px;color:var(--muted)}
.day.pre{opacity:.75}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day[aria-pressed="true"] i{color:inherit;opacity:.8}
.chips{display:flex;gap:6px;overflow-x:auto;margin:6px -16px 0;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px;font-size:13px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--rose);border-color:var(--rose);color:var(--on-rose)}
.chip.now[aria-pressed="false"]{border-color:var(--rose);color:var(--rose);font-weight:700}

main{padding:0 12px calc(110px + env(safe-area-inset-bottom,0px));max-width:720px;margin:0 auto}
.banner{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--ink);color:var(--bg);border-radius:10px;padding:6px 10px;margin:8px 0 2px;font-size:13px}
.banner button{border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;padding:4px}
.hour{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--stick,0px));z-index:5;background:var(--bg);display:flex;align-items:baseline;gap:8px;padding:8px 2px 3px;transition:top .22s ease-out}
.hour h2{margin:0;font-family:var(--display);font-weight:800;font-size:22px;line-height:1;letter-spacing:-.02em}
.hour span{color:var(--muted);font-size:12px}
.dayhead h2{font-size:22px}
.gig{display:grid;grid-template-columns:50px 1fr 40px;gap:8px;align-items:start;background:var(--surface);border-radius:12px;padding:8px 2px 8px 10px;margin:4px 0;border:1.5px solid transparent}
.gig.on{border-color:var(--gold)}
.gig.past{opacity:.5}
.gig.starred{border-color:var(--rose);background:linear-gradient(90deg,var(--rose-soft),var(--surface) 60%)}
.gig.ghost{opacity:.7;border-style:dashed;border-color:var(--line)}
.t{font-family:var(--display);line-height:1.1}
.t b{display:block;font-size:17px;font-weight:700}
.t span{font-size:12px;color:var(--muted);white-space:nowrap}
.b{min-width:0}
.b h3{margin:0;font-size:16px;line-height:1.25;overflow-wrap:anywhere}
.b .d{margin:1px 0 0;color:var(--muted);font-size:13px;line-height:1.3}
.b .v{margin:3px 0 0;font-size:13px;font-weight:700;display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px}
.b .v button{border:0;background:none;padding:0;font-weight:700;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.b .v em{font-style:normal;font-weight:400;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;align-items:center}
.tag{font-size:11px;border-radius:5px;padding:1px 6px;font-weight:700}
.tag.join{background:var(--join-soft);color:var(--join)}
.tag.live{background:var(--gold);color:#1C1630}
.tag.book{background:var(--ink);color:var(--bg);text-decoration:none}
.tag.clash{background:var(--rose);color:var(--on-rose)}
.crew{display:inline-flex;gap:3px}
.crew i{font-style:normal;font-size:11px;font-weight:700;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:var(--ink);color:var(--bg)}
.star{border:0;background:none;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;margin-top:-6px}
.star svg{width:22px;height:22px;fill:none;stroke:var(--muted);stroke-width:1.8}
.star[aria-pressed="true"] svg{fill:var(--rose);stroke:var(--rose)}
.star[aria-pressed="true"]{animation:pop .25s ease-out}
@keyframes pop{50%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.star[aria-pressed="true"]{animation:none}}
.gap{margin:1px 0 1px 68px;font-size:12px;color:var(--muted)}
.gap.bad{color:var(--rose);font-weight:700}
.empty{text-align:center;padding:48px 16px;color:var(--muted)}
.empty h3{color:var(--ink);font-family:var(--display);font-size:24px;margin:0 0 6px}
.vlist button{display:flex;width:100%;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--surface);border:0;border-radius:12px;padding:10px 12px;margin:4px 0}
.vlist b{font-size:16px}
.vlist small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.vlist .n{font-family:var(--display);font-size:20px;font-weight:800;color:var(--rose)}
.panel{background:var(--surface);border-radius:14px;padding:14px;margin:12px 0}
.panel h3{margin:0 0 6px;font-family:var(--display);font-size:22px}
.panel p{margin:4px 0 10px;color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.alt{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.rose{background:var(--rose);color:var(--on-rose)}
.panel input[type=text],.panel textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font:inherit;font-size:16px}
.panel textarea{min-height:90px;resize:vertical}
.friend{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.friend:first-of-type{border-top:0}
.friend .who{display:flex;align-items:center;gap:8px}
.friend .who i{font-style:normal;font-size:12px;font-weight:700;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--bg)}
.friend button{border:0;background:none;color:var(--rose);font-weight:700;padding:6px}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px;margin:10px 0}
.toggle input{width:20px;height:20px;accent-color:var(--rose)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:6px 8px max(24px, calc(env(safe-area-inset-bottom,0px) + 12px))}
nav.tabs button{flex:1;border:0;background:none;padding:8px 4px;min-height:52px;border-radius:10px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px}
nav.tabs svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--rose)}
nav.tabs .badge{font-family:var(--display);}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.gig .b{cursor:pointer}
.more{font-size:12px;font-weight:700;color:var(--rose)}
.stage{font-size:12px;font-weight:700;border:1.5px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.tag.chg{background:var(--gold-soft);color:var(--ink);box-shadow:inset 0 0 0 1px var(--gold)}
.vhead{padding:4px 0 0}
.vctl{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--stick,0px));z-index:6;background:var(--bg);margin:0 -12px;padding:2px 12px 6px;border-bottom:1px solid var(--line);transition:top .22s ease-out}
.vctl .days{margin-top:2px}
.back{border:0;background:none;padding:2px 0;color:var(--rose);font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:4px}
.vhead h2{margin:0;font-family:var(--display);font-weight:800;font-size:26px;line-height:1.05;letter-spacing:-.02em}
.vhead p{margin:0 0 4px;color:var(--muted);font-size:13px}
.vctl .days,.vctl .chips{margin-left:-12px;margin-right:-12px;padding-left:12px;padding-right:12px}
.vlist .live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-right:6px;vertical-align:middle}
.vfind{margin:12px 0 0}
.scrim{position:fixed;inset:0;background:rgba(18,14,28,.5);z-index:50;opacity:0;transition:opacity .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--surface);border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .25s ease-out;max-width:720px;margin:0 auto}
.sheet.open{transform:none}.scrim.open{opacity:1}
@media (prefers-reduced-motion:reduce){.sheet,.scrim{transition:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet .x{position:absolute;right:10px;top:10px;border:0;background:var(--bg);width:36px;height:36px;border-radius:50%;font-size:20px;line-height:1}
.sheet .when{font-family:var(--display);font-size:18px;font-weight:700;color:var(--rose);margin:4px 48px 0 0}
.sheet h2{font-family:var(--display);font-weight:800;font-size:34px;line-height:1.05;margin:4px 0 6px;letter-spacing:-.02em;overflow-wrap:anywhere}
.sheet .d{color:var(--muted);margin:0 0 10px;font-size:16px}
.sheet .where{display:flex;width:100%;text-align:left;justify-content:space-between;align-items:center;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px;margin:10px 0}
.sheet .where b{font-size:17px}.sheet .where small{display:block;color:var(--muted);font-size:13px}
.sheet .where span.go{color:var(--rose);font-weight:700;font-size:14px;white-space:nowrap}
.sheet .act{display:flex;gap:8px;margin:12px 0}
.sheet .act .btn{flex:1;text-align:center;text-decoration:none;padding:13px}
.sheet h4{margin:20px 0 6px;font-size:15px}
.sheet .note{font-size:14px;margin:6px 0;color:var(--muted)}
.sheet .note.bad{color:var(--rose);font-weight:700}
.alt{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:11px 0}
.alt:first-of-type{border-top:0}
.alt b{font-family:var(--display);font-size:17px;line-height:1.1}
.alt b small{display:block;font-family:var(--body);font-size:12px;color:var(--muted);font-weight:400}
.alt .vn{font-size:15px}.alt .vn em{font-style:normal;color:var(--muted)}
.alt .on{color:var(--rose)}
.alt.past{opacity:.5}
.gig.cx h3{text-decoration:line-through;text-decoration-thickness:2px}
.gig.cx{opacity:.6}
.tag.cxl{background:var(--rose);color:var(--on-rose)}

.seg{display:inline-flex;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:2px;margin:8px 0 2px}
.seg button{border:0;background:none;padding:4px 12px;border-radius:8px;font-size:13px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ttwrap{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ttwrap small{color:var(--muted);font-size:12px}
.tt{position:relative;overflow:auto;-webkit-overflow-scrolling:touch;margin:4px -12px 0;height:calc(100dvh - var(--stick,0px) - 150px - env(safe-area-inset-bottom,0px));min-height:300px;background:var(--bg);border-top:1px solid var(--line);overscroll-behavior:contain}
.tt-in{position:relative}
.tt-row{display:flex;height:46px;border-bottom:1px solid var(--line)}
.tt-row.first{border-top:1.5px solid var(--line)}
.tt-name{position:sticky;left:0;z-index:3;flex:0 0 104px;width:104px;background:var(--bg);border:0;border-right:1.5px solid var(--line);text-align:left;padding:3px 6px 3px 10px;font-size:12px;line-height:1.15;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
.tt-name b{font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tt-name span{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt-name.cont b{display:none}
.tt-track{position:relative;flex:0 0 auto}
.tt-head{position:sticky;top:0;z-index:4;display:flex;height:24px;background:var(--bg);border-bottom:1px solid var(--line)}
.tt-head .tt-corner{position:sticky;left:0;z-index:5;flex:0 0 104px;background:var(--bg);border-right:1.5px solid var(--line)}
.tt-hr{position:absolute;top:0;height:24px;font-family:var(--display);font-weight:700;font-size:13px;padding:4px 0 0 4px;border-left:1px solid var(--line)}
.tt-grid{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line);opacity:.7}
.tt-b{position:absolute;top:4px;bottom:4px;border:0;border-radius:7px;background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--line);padding:3px 6px;text-align:left;overflow:hidden;font-size:12px;line-height:1.15;color:var(--ink)}
.tt-b b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.tt-b span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);font-size:11px}
.tt-b.join{box-shadow:inset 0 0 0 1.5px var(--join);background:var(--join-soft)}
.tt-b.picked{background:var(--rose);box-shadow:none;color:var(--on-rose)}.tt-b.picked span{color:var(--on-rose);opacity:.85}
.tt-b.live{box-shadow:inset 0 0 0 2.5px var(--gold)}
.tt-b.cx{opacity:.45}.tt-b.cx b{text-decoration:line-through}
.tt-b.dim{opacity:.22}
.tt-now{position:absolute;top:0;bottom:0;width:2px;background:var(--rose);z-index:2;pointer-events:none}
.tt-now::before{content:"Now";position:absolute;top:4px;left:4px;font-size:10px;font-weight:700;color:var(--rose);background:var(--bg);padding:0 3px;border-radius:3px}
input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
.tt-name.cont{border-top:0}
.tt-row.cont{border-top:0}

/* ---- running-order rows (replaces separate cards) ---- */
body{background:var(--bg)}
.brand h1{font-size:24px;font-weight:900;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brand small{white-space:nowrap}
.brand h1 span{color:var(--rose)}
.day b{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.02em}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.hour{padding:12px 4px 4px}
.hour h2{font-family:var(--display);font-weight:900;font-size:30px;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.dayhead h2{font-size:28px}
.gig,.gap{background:var(--surface);margin:0}
.gig{border:0;border-radius:0;border-bottom:1px solid var(--line);padding:10px 2px 10px 12px;grid-template-columns:58px minmax(0,1fr) 40px}
.gap{padding:4px 12px 4px 76px;border-bottom:1px solid var(--line);margin:0}
:is(.gig,.gap):not(:is(.gig,.gap) + :is(.gig,.gap)){border-top-left-radius:14px;border-top-right-radius:14px;margin-top:2px}
:is(.gig,.gap):not(:has(+ :is(.gig,.gap))){border-bottom-left-radius:14px;border-bottom-right-radius:14px;border-bottom:0;margin-bottom:6px}
.gig.on{border-color:var(--line)}
.gig.starred{border-color:var(--line);background:var(--rose-soft)}
.gig.ghost{border-style:solid;border-color:var(--line);opacity:.65}
.t{font-family:var(--display);font-variant-numeric:tabular-nums;position:relative}
.t b{font-size:21px;font-weight:800;line-height:1;letter-spacing:.01em;white-space:nowrap}
.t span{font-family:var(--body);font-size:11.5px;display:block;margin-top:2px}
.gig.on .t::before{content:"";position:absolute;left:-8px;top:7px;width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.b h3{font-size:16px;font-weight:700;text-wrap:balance}
.b .v button{text-decoration-color:var(--line)}
.more{color:var(--muted);font-weight:700}
.star[aria-pressed="true"] svg{fill:var(--rose);stroke:var(--rose)}
.tag.book{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.banner{background:var(--ink);color:var(--bg)}
.vlist{display:flex;flex-direction:column}
.vlist button{border-radius:0;margin:0;border-bottom:1px solid var(--line)}
.vlist button:first-child{border-top-left-radius:14px;border-top-right-radius:14px}
.vlist button:last-child{border-bottom-left-radius:14px;border-bottom-right-radius:14px;border-bottom:0}

function schedulePush(){ if (!cloud) return; clearTimeout(pushT); pushT = setTimeout(pushCloud, 700); }
async function pushCloud(){
  if (!cloud) return;
  if (pushing){ pushAgain = true; return; }
  pushing = true;
  try { await cloud.ref.set({stars:[...stars], friends, name:myName, updated:Date.now()}); cloudState = "ok"; }
  catch(e){ if (e && (e.code==="invalid_argument" || e.code==="revoked" || e.code==="not_granted")){ cloud = null; cloudState = "off"; } else cloudState = "err"; }
  pushing = false;
  if (pushAgain){ pushAgain = false; pushCloud(); }
  updateSaveStatus();
}
async function initCloud(){
  try {
    if (!window.claude || !window.claude.use){ cloudState="off"; return updateSaveStatus(); }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user){ cloudState="off"; return updateSaveStatus(); }
    const uid = await user.id();
    if (!uid){ cloudState="off"; return updateSaveStatus(); }
    const ref = db.doc("data/users/" + uid + "/plan");
    const snap = await ref.get();
    let changed = false;
    if (snap.exists){
      const d = snap.data() || {};
      (Array.isArray(d.stars) ? d.stars : []).forEach(id => { if (BY_ID[id] && !stars.has(id)){ stars.add(id); changed = true; } });
      (Array.isArray(d.friends) ? d.friends : []).forEach(f => {
        if (f && typeof f.name==="string" && Array.isArray(f.ids) && !friends.some(x => x.name.toLowerCase()===f.name.toLowerCase())){
          friends.push({name:String(f.name).slice(0,40), ids:f.ids.filter(id=>BY_ID[id])}); changed = true; }
      });
      if (!myName && typeof d.name==="string"){ myName = d.name.slice(0,40); changed = true; }
    }
    cloud = {ref};
    if (changed){ try{ localStorage.setItem("lmf26.stars", JSON.stringify([...stars])); localStorage.setItem("lmf26.friends", JSON.stringify(friends)); localStorage.setItem("lmf26.name", JSON.stringify(myName)); }catch(e){} }
    await pushCloud();
    if (changed) rerenderKeepScroll(); else updateSaveStatus();
  } catch(e){ cloudState = "off"; updateSaveStatus(); }
}

function startOf(day){ return new Date(2026, 9, DAYS[day].date, 0, 0, 0).getTime(); }
function absStart(g){ return startOf(g.day) + g.s*60000; }
function absEnd(g){ return startOf(g.day) + g.e*60000; }
function hhmm(m){ m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0"); }
function todayIdx(){
  const n = new Date();
  if (n.getFullYear()!==2026 || n.getMonth()!==9) return -1;
  const d = new Date(n.getTime() - 4*3600000).getDate(); // before 4am counts as the night before
  return DAYS.findIndex(x => x.date === d);
}
function dur(min){ const h=Math.floor(min/60), m=min%60; return h ? (m ? `${h}h ${m}m` : `${h}h`) : `${m} min`; }
const isLive = g => { const n=Date.now(); return absStart(g) <= n && n < absEnd(g); };
const isPast = g => absEnd(g) <= Date.now();

function passFilter(g){
  if (state.filter==="gig" && g.join) return false;

  if (state.filter==="book" && !g.url) return false;

function changeNote(g){
  const c = CHG[g.id]; if (!c) return "";
  if (c.k==="new") return "Newly added";
  if (c.k==="swap") return `Changed: was ${c.was}`;
  const w = c.was; const bits=[];
  if (w.s!==g.s || w.e!==g.e || w.day!==g.day) bits.push(`was ${w.day!==g.day?DAYS[w.day].short+" ":""}${hhmm(w.s)} to ${hhmm(w.e)}`);

}

function card(g, opts={}){
  const live = isLive(g), past = isPast(g);

  if (opts.showStage && g.room) tags.push(`<span class="stage">${esc(g.room)}</span>`);

  if (g.url) tags.push(`<a class="tag book" href="${esc(g.url)}" target="_blank" rel="noopener">Book</a>`);

function applyStick(){
  document.body.classList.toggle("hide-hdr", hdrHidden);
  document.documentElement.style.setProperty("--stick", hdrHidden ? "0px" : (hdrH-1)+"px");
}
let lastY = 0;
window.addEventListener("scroll", () => {
  const y = Math.max(0, window.scrollY);
  if (state.sheet) { lastY = y; return; }
  let want = hdrHidden;
  if (y < hdrH) want = false;
  else if (y > lastY + 8) want = true;
  else if (y < lastY - 8) want = false;
  if (Math.abs(y - lastY) > 8 || y < hdrH) lastY = y;
  if (want !== hdrHidden){ hdrHidden = want; applyStick(); }
}, {passive:true});
document.addEventListener("focusin", e => { if (e.target.closest && e.target.closest("#hdr") && hdrHidden){ hdrHidden=false; applyStick(); } });

// ---------- views ----------
function updateBanner(){
  const c = DATA.c; if (!c || seenVer===c.ver) return "";
  const n = c.changed.filter(x=>x.k==="new").length, ch = c.changed.length - n, g = c.gone.length;
  return `<div class="banner"><span>Updated ${esc(c.ver)}: ${n} added, ${ch} changed, ${g} cancelled</span><button data-changes>See what</button></div>`;
}
function renderList(){
  const now = Date.now();
  let out = updateBanner();
  if (state.now){
    const pool = GIGS.filter(g => passFilter(g) && matches(g) && absEnd(g) > now);
    const live = pool.filter(g => absStart(g) <= now);
    const soon = pool.filter(g => absStart(g) > now && absStart(g) - now <= 90*60000);
    if (!live.length && !soon.length){
      const next = pool.sort((a,b)=>absStart(a)-absStart(b)).slice(0,12);
      if (!next.length) return out + `<div class="empty"><h3>That's a wrap</h3><p>Nothing else matches. See you in 2027.</p></div>`;
      return out + `<div class="hour"><h2>Coming up</h2><span>Nothing on in the next 90 minutes</span></div>` + next.map(g => card(g,{showDay:true})).join("");
    }
    if (live.length) out += `<div class="hour"><h2>On now</h2><span>${live.length}</span></div>` + live.sort((a,b)=>a.e-b.e).map(g=>card(g)).join("");
    if (soon.length) out += `<div class="hour"><h2>Next 90 min</h2><span>${soon.length}</span></div>` + soon.sort((a,b)=>absStart(a)-absStart(b)).map(g=>card(g)).join("");
    return out;
  }
  let list = GIGS.filter(g => passFilter(g) && matches(g));
  if (!state.q) list = list.filter(g => g.day===state.day);
  if (state.hidePast && !state.q) list = list.filter(g => absEnd(g) > now);
  if (!list.length){
    return out + `<div class="empty"><h3>No matches</h3><p>${state.q ? "Try a shorter search, or a style like “folk” or “jazz”." : "Nothing left on this day with these filters. Try “Everything” or another day."}</p></div>`;
  }
  if (state.q){
    out += `<div class="hour"><h2>${list.length} result${list.length===1?"":"s"}</h2><span>across all days</span></div>`;
    let lastDay = -1;
    for (const g of list){
      if (g.day!==lastDay){ out += `<div class="hour dayhead"><h2>${DAYS[g.day].name} ${DAYS[g.day].date}</h2></div>`; lastDay=g.day; }
      out += card(g);
    }
    return out;
  }
  let lastH = -1; const perHour = {};
  list.forEach(g => { const h=Math.floor(g.s/60); perHour[h]=(perHour[h]||0)+1; });
  for (const g of list){
    const h = Math.floor(g.s/60);
    if (h!==lastH){ out += `<div class="hour"><h2>${hhmm(h*60)}</h2><span>${perHour[h]} starting</span></div>`; lastH=h; }
    out += card(g);
  }
  return out;
}

function renderVenues(){
  const seg = `<div class="ttwrap"><div class="seg" role="group" aria-label="Venue view"><button data-vmode="grid" aria-pressed="${state.vmode==="grid"}">Timetable</button><button data-vmode="list" aria-pressed="${state.vmode==="list"}">List</button></div>${state.vmode==="grid" ? (state.day===t0 ? `<button class="chip" data-hidepast aria-pressed="${state.hidePast}">Hide finished stages</button>` : `<small>Tap a venue or a show</small>`) : ""}</div>`;
  return seg + (state.vmode==="grid" ? renderGrid() : renderVenueList());
}
function renderVenueList(){
  const day = state.day, now = Date.now();
  const q = state.q;
  const rows = Object.entries(BY_AREA).map(([area, gs]) => {
    const today = gs.filter(g => g.day===day);
    const rooms = new Set(gs.map(g=>g.room).filter(Boolean));
    const live = today.filter(isLive);
    const next = today.filter(g => absStart(g) > now).sort((a,b)=>a.s-b.s)[0];
    return {area, total:gs.length, today, rooms, live, next,
      s: today.length ? Math.min(...today.map(g=>g.s)) : 0, e: today.length ? Math.max(...today.map(g=>g.e)) : 0};
  }).filter(r => r.today.length && (!q || r.area.toLowerCase().includes(q) || r.today.some(g=>g.hay.includes(q))))
    .sort((a,b)=> b.today.length-a.today.length || a.area.localeCompare(b.area));
  if (!rows.length) return `<div class="empty"><h3>No venues</h3><p>Nothing ${q?"matches “"+esc(q)+"” ":""}on ${DAYS[day].name}.</p></div>`;
  return `<div class="hour"><h2>${DAYS[day].name}</h2><span>${rows.length} venues, busiest first</span></div><div class="vlist">` +
    rows.map(r => {
      let sub = `${hhmm(r.s)} to ${hhmm(r.e)}${r.rooms.size>1?`, ${r.rooms.size} stages`:""}`;
      if (r.live.length) sub = `<span class="live"></span>Now: ${esc(r.live.map(g=>g.act).join(", "))}`;
      else if (t0===day && r.next) sub += `. Next: ${hhmm(r.next.s)} ${esc(r.next.act)}`;
      return `<button data-venue="${esc(r.area)}" data-vday="${day}"><span><b>${esc(r.area)}</b><small>${sub}</small></span><span class="n" aria-label="${r.today.length} events">${r.today.length}</span></button>`;
    }).join("") + `</div>`;
}

const PXM = 3; // pixels per minute
function renderGrid(){
  const day = state.day, now = Date.now(), q = state.q;
  const todays = GIGS.filter(g => g.day===day);
  if (!todays.length) return `<div class="empty"><h3>Nothing on</h3><p>No events on ${DAYS[day].name}.</p></div>`;
  const t0m = Math.floor(Math.min(...todays.map(g=>g.s))/60)*60;
  const t1m = Math.ceil(Math.max(...todays.map(g=>g.e))/60)*60;
  const W = (t1m - t0m) * PXM;
  // group by venue, busiest first; one row per stage
  const areas = {};
  todays.forEach(g => { (areas[g.area] = areas[g.area] || []).push(g); });
  let list = Object.entries(areas).sort((a,b)=> b[1].length-a[1].length || a[0].localeCompare(b[0]));
  const hit = g => !q || g.hay.includes(q);
  if (q) list = list.filter(([a,gs]) => a.toLowerCase().includes(q) || gs.some(hit));
  if (!list.length) return `<div class="empty"><h3>No venues</h3><p>Nothing matches “${esc(q)}” on ${DAYS[day].name}.</p></div>`;
  let head = `<div class="tt-head"><div class="tt-corner"></div><div class="tt-track" style="width:${W}px">`;
  for (let m=t0m; m<t1m; m+=60) head += `<div class="tt-hr" style="left:${(m-t0m)*PXM}px">${hhmm(m)}</div>`;
  head += `</div></div>`;
  let lines = "";
  for (let m=t0m; m<t1m; m+=60) lines += `<div class="tt-grid" style="left:${(m-t0m)*PXM}px"></div>`;
  const nowM = (now - startOf(day))/60000;
  const nowLine = (nowM > t0m && nowM < t1m) ? `<div class="tt-now" style="left:${(nowM-t0m)*PXM}px"></div>` : "";
  let rows = "";
  const SCATTER = /^(busk stops|juke box shops)$/i;
  list.sort((a,b)=> (SCATTER.test(a[0])?1:0) - (SCATTER.test(b[0])?1:0));
  for (const [area, gs] of list){
    const areaQ = q && area.toLowerCase().includes(q);
    const scatter = SCATTER.test(area);
    const roomsAll = [...new Set(gs.map(g=>g.room))];
    // one row per stage (busy stages first); busk spots share packed rows
    let groups = scatter ? [["", gs]] : roomsAll.map(r => [r, gs.filter(g=>g.room===r)]).sort((x,y)=> y[1].length-x[1].length);
    if (day===t0 && state.hidePast) groups = groups.filter(([r,x]) => x.some(g => absEnd(g) > now));
    if (!groups.length) continue;
    let firstRow = true;
    for (const [room, sgAll] of groups){
      const sg = sgAll.slice().sort((x,y)=>x.s-y.s);
      const lanes = [];
      sg.forEach(g => { let l = lanes.findIndex(end => end <= g.s); if (l<0){ l=lanes.length; lanes.push(0);} lanes[l]=g.e; g._lane=l; });
      for (let l=0; l<lanes.length; l++){
        const label = firstRow ? `<b>${esc(area)}</b>${room?`<span>${esc(room)}</span>`:(scatter?`<span>${gs.length} spots around town</span>`:"")}`
                                : (l===0 && room ? `<span style="color:var(--ink)">${esc(room)}</span>` : "");
        rows += `<div class="tt-row${firstRow?" first":" cont"}"><button class="tt-name${firstRow?"":" cont"}" data-venue="${esc(area)}" data-vday="${day}" aria-label="Open ${esc(area)}${room?", "+esc(room):""}">${label}</button><div class="tt-track" style="width:${W}px">${lines}${nowLine}`;
        sg.filter(g=>g._lane===l).forEach(g => {
          const cls = ["tt-b"]; if (g.join) cls.push("join"); if (stars.has(g.id)) cls.push("picked");
          if (isLive(g)) cls.push("live"); if (g.cx) cls.push("cx"); if (q && !areaQ && !hit(g)) cls.push("dim");
          const w = Math.max((g.e-g.s)*PXM - 3, 18);
          const sub = `${hhmm(g.s)} ${scatter && g.room ? esc(g.room) : esc(g.desc||"")}`;
          rows += `<button class="${cls.join(" ")}" data-open="${g.id}" style="left:${(g.s-t0m)*PXM+1}px;width:${w}px" aria-label="${esc(g.act)}, ${hhmm(g.s)} to ${hhmm(g.e)}${g.room?", "+esc(g.room):""}${stars.has(g.id)?", in your plan":""}"><b>${esc(g.act)}</b><span>${sub}</span></button>`;
        });
        rows += `</div></div>`;
        firstRow = false;
      }
    }
  }
  return `<div class="tt" id="tt" data-t0="${t0m}" data-day="${day}"><div class="tt-in" style="width:${W+104}px">${head}${rows}</div></div>`;
}
let ttScrollKey = "";
function positionGrid(){
  const el = document.getElementById("tt"); if (!el) return;
  const key = el.dataset.day;
  if (key === ttScrollKey) return; // keep the viewer's place on re-render
  ttScrollKey = key;
  const day = +el.dataset.day, t0m = +el.dataset.t0;
  const nowM = (Date.now() - startOf(day))/60000;
  const firstStar = [...stars].map(x=>BY_ID[x]).filter(g=>g && g.day===day).sort((a,b)=>a.s-b.s)[0];
  let target = (nowM > t0m && nowM < t0m + 1800) ? nowM - 30 : firstStar ? firstStar.s - 30 : (day>=4 ? 17*60 : t0m);
  el.scrollLeft = Math.max(0, (target - t0m) * PXM);
}

function renderVenue(){
  const area = state.venue, all = BY_AREA[area] || [];
  const days = [...new Set(all.map(g=>g.day))].sort((a,b)=>a-b);
  if (state.vday===null || !days.includes(state.vday)) state.vday = days.includes(state.day) ? state.day : days[0];
  const rooms = [...new Set(all.map(g=>g.room).filter(Boolean))];
  if (state.vstage && !rooms.includes(state.vstage)) state.vstage = "";
  const list = all.filter(g => g.day===state.vday && (!state.vstage || g.room===state.vstage)).sort((a,b)=>a.s-b.s || a.room.localeCompare(b.room));
  const span = days.length>1 ? `${DAYS[days[0]].short} to ${DAYS[days[days.length-1]].short}` : DAYS[days[0]].name;
  let out = `<div class="vhead">
    <button class="back" data-back aria-label="Back">‹ Back</button>
    <h2>${esc(area)}</h2>
    <p>${all.length} event${all.length>1?"s":""}, ${span}${rooms.length>1?`, ${rooms.length} stages`:""}</p>
  </div><div class="vctl">
    <div class="days" role="group" aria-label="Day at this venue">${days.map(d => {
      const n = all.filter(g=>g.day===d).length;
      return `<button class="day${d===t0?" today":""}" data-vdaypick="${d}" aria-pressed="${d===state.vday}" aria-label="${DAYS[d].name}, ${n} events"><b>${DAYS[d].short} ${DAYS[d].date}</b></button>`; }).join("")}</div>
    ${rooms.length>1 ? `<div class="chips" role="group" aria-label="Stage"><button class="chip" data-vstage="" aria-pressed="${!state.vstage}">All stages</button>${rooms.map(r=>`<button class="chip" data-vstage="${esc(r)}" aria-pressed="${state.vstage===r}">${esc(r)}</button>`).join("")}</div>` : ""}
  </div>`;
  let prevEnd = null;
  for (const g of list){
    if (!state.vstage && rooms.length>1){ /* gaps make no sense across stages */ }
    else if (prevEnd!==null && g.s - prevEnd >= 15) out += `<div class="gap">${dur(g.s-prevEnd)} break</div>`;
    out += card(g, {hideVenue:true, showStage: rooms.length>1});
    prevEnd = Math.max(prevEnd ?? 0, g.e);
  }
  return out;
}

function renderPlan(){
  let out = `<div id="saveStatus">${saveStatusHTML()}</div>`;
  if (goneStars.length){
    out += `<div class="panel" style="border:1.5px solid var(--rose)"><h3>Cancelled since you starred them</h3>${goneStars.map(g=>`<p style="margin:4px 0;color:var(--ink)">${DAYS[g.day].short} ${hhmm(g.s)} <b>${esc(g.act)}</b>, ${esc(g.area)}</p>`).join("")}<div class="row" style="margin-top:8px"><button class="btn alt" data-cleargone>Dismiss</button></div></div>`;
  }
  const mine = [...stars].map(id => BY_ID[id]).filter(Boolean);
  const crewIds = showCrew ? new Set(friends.flatMap(f => f.ids)) : new Set();
  const ghosts = [...crewIds].filter(id => !stars.has(id) && BY_ID[id]).map(id => BY_ID[id]);
  const all = [...mine.map(g=>({g,ghost:false})), ...ghosts.map(g=>({g,ghost:true}))].sort((a,b)=> absStart(a.g)-absStart(b.g));
  if (!all.length){
    out += `<div class="empty"><h3>Your plan is empty</h3><p>Tap the star on anything in Listings and it lands here, in time order, with clashes flagged.</p></div>`;
  } else {
    let lastDay=-1, prev=null;
    for (const {g,ghost} of all){
      if (g.day!==lastDay){ out += `<div class="hour dayhead"><h2>${DAYS[g.day].name} ${DAYS[g.day].date}</h2><span>${mine.filter(x=>x.day===g.day).length} starred</span></div>`; lastDay=g.day; prev=null; }
      let clash=false;
      if (!ghost && !g.cx){
        clash = clashWith(g).length > 0;
        if (prev){
          const gap = g.s - prev.e;
          out += gap < 0 ? `<div class="gap bad">Overlaps ${esc(prev.act)} by ${dur(Math.min(prev.e,g.e)-g.s)}</div>`
                : gap === 0 ? `<div class="gap">Straight on, no break</div>`
                : `<div class="gap">${dur(gap)} free</div>`;
        }
        if (!prev || g.e > prev.e) prev = g;
      }
      out += card(g,{clash, ghost, keepPast:true, plan:true});
    }
  }
  out += `<div class="panel"><h3>Share with friends</h3>
    <p>Send your picks to friends. When they add your plan, your initials show on everything you're going to.</p>
    <label for="myName" class="sr">Your name</label>
    <input type="text" id="myName" placeholder="Your name" value="${esc(myName)}" autocomplete="given-name">
    <div class="row" style="margin-top:10px"><button class="btn rose" data-share>Share my plan</button>${dlReady?`<button class="btn alt" data-ics>Add to calendar</button>`:""}</div>
    <textarea id="shareOut" readonly style="display:none;margin-top:10px" aria-label="Your plan to copy"></textarea></div>`;
  out += `<div class="panel"><h3>Your crew</h3>
    <p>Paste a message a friend shared from this app to see their picks alongside yours.</p>
    <textarea id="paste" placeholder="Paste a friend's shared plan here" aria-label="Friend's shared plan"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn" data-addfriend>Add their plan</button></div>
    ${friends.length ? `<div style="margin-top:12px">${friends.map((f,i)=>`<div class="friend"><span class="who"><i>${esc(initials(f.name))}</i>${esc(f.name)} <span style="color:var(--muted);font-size:13px">${f.ids.length} picks</span></span><button data-rmfriend="${i}">Remove</button></div>`).join("")}</div>
      <label class="toggle"><input type="checkbox" id="crewToggle" ${showCrew?"checked":""}> Show crew picks in my plan</label>` : ""}
  </div>`;
  return out;
}

function render(){
  renderDays(); renderChips();
  document.getElementById("planCount").textContent = stars.size ? `(${stars.size})` : "";
  document.getElementById("count").textContent = `${GIGS.length} events`;

// ---------- detail sheet ----------
const sheetEl = document.getElementById("sheet"), scrimEl = document.getElementById("scrim");
let lastFocus = null;
function altRow(o){

    <span class="vn">${venueLabel(o)}${live?' <span class="tag live">On now</span>':""}${clashWith(o).length && !stars.has(o.id)?' <span class="tag clash">Clashes with your plan</span>':""}</span>

function fillSheet(){

    <div class="act">

    </div>

    <h4>${others.length ? `Other times ${esc(g.act)} is on` : "Other times"}</h4>

function altRowAct(o){
  return `<button class="alt" data-open="${o.id}"><b>${hhmm(o.s)}<small>to ${hhmm(o.e)}</small></b><span class="vn">${esc(o.act)}${o.desc?` <em>${esc(o.desc)}</em>`:""}</span><span aria-hidden="true">›</span></button>`;
}
function openSheet(id, push=true){
  if (!BY_ID[id]) return;
  const wasOpen = !!state.sheet;
  state.sheet = id;
  if (!wasOpen) lastFocus = document.activeElement;
  fillSheet();
  sheetEl.scrollTop = 0;
  if (!wasOpen){
    sheetEl.hidden = false; scrimEl.hidden = false;
    document.body.style.overflow = "hidden";
    requestAnimationFrame(()=>{ sheetEl.classList.add("open"); scrimEl.classList.add("open"); });
  }
  if (push) history.pushState({sheet:id, view:state.view, venue:state.venue}, "");
  setTimeout(()=>sheetEl.querySelector(".x")?.focus({preventScroll:true}), 30);
}
function closeSheet(fromPop=false){
  if (!state.sheet) return;
  state.sheet = null;
  sheetEl.classList.remove("open"); scrimEl.classList.remove("open");
  document.body.style.overflow = "";
  setTimeout(()=>{ if (!state.sheet){ sheetEl.hidden = true; scrimEl.hidden = true; } }, 260);
  if (!fromPop && history.state && history.state.sheet) history.back();
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus({preventScroll:true});
}
function showChanges(){
  const c = DATA.c;
  const rows = c.changed.map(x => BY_ID[x.id]).filter(Boolean).sort((a,b)=>absStart(a)-absStart(b));
  state.sheet = "__changes";
  sheetEl.innerHTML = `<div class="grab" aria-hidden="true"></div><button class="x" data-close aria-label="Close">×</button>
    <p class="when">Updated ${esc(c.ver)}</p><h2 id="sheetTitle">What's changed</h2>
    <h4>Added or changed</h4>${rows.map(g=>`<button class="alt" data-open="${g.id}"><b>${DAYS[g.day].short} ${DAYS[g.day].date}<small>${hhmm(g.s)} to ${hhmm(g.e)}</small></b><span class="vn">${esc(g.act)} <em>${esc(g.area)}</em><br><span style="font-size:13px;color:var(--rose)">${esc(changeNote(g))}</span></span><span aria-hidden="true">›</span></button>`).join("")}
    ${c.gone.length?`<h4>Cancelled</h4>${c.gone.map(g=>`<div class="alt" style="cursor:default"><b>${DAYS[g.day].short} ${DAYS[g.day].date}<small>${hhmm(g.s)} to ${hhmm(g.e)}</small></b><span class="vn"><s>${esc(g.act)}</s> <em>${esc(g.area)}</em></span><span></span></div>`).join("")}`:""}`;
  lastFocus = document.activeElement;
  sheetEl.hidden = false; scrimEl.hidden = false; document.body.style.overflow="hidden";
  requestAnimationFrame(()=>{ sheetEl.classList.add("open"); scrimEl.classList.add("open"); });
  history.pushState({sheet:"__changes"}, "");
  seenVer = c.ver; store.set("seenVer", seenVer);
}
const _fill = fillSheet;
fillSheet = function(){ if (state.sheet==="__changes") return; _fill(); };

// ---------- navigation ----------
function openVenue(area, day){
  state.venue = area; state.vday = Number.isFinite(day) ? day : null; state.vstage = "";
  if (state.sheet){ state.sheet = null; sheetEl.classList.remove("open"); scrimEl.classList.remove("open"); sheetEl.hidden = true; scrimEl.hidden = true; document.body.style.overflow=""; }
  state.prevView = state.view==="venue" ? state.prevView : state.view;
  state.view = "venue";
  history.pushState({view:"venue", venue:area}, "");
  render(); window.scrollTo(0,0); hdrHidden=false; applyStick();
}
window.addEventListener("popstate", e => {
  const s = e.state || {};
  if (state.sheet && !s.sheet){ closeSheet(true); if (s.view===state.view) return; }
  if (s.sheet && s.sheet!=="__changes"){
    const v = s.view || "list";
    if (v!==state.view || (v==="venue" && s.venue!==state.venue)){ state.view = v; if (s.venue) state.venue = s.venue; render(); }
    openSheet(s.sheet, false); return; }
  if (state.view==="venue" && s.view!=="venue"){ state.view = state.prevView || "venues"; render(); window.scrollTo(0,0); hdrHidden=false; applyStick(); }
  else if (s.view==="venue" && s.venue){ state.venue = s.venue; state.view="venue"; render(); }
});

// ---------- sharing ----------
function shareText(){
  const mine = [...stars].map(id=>BY_ID[id]).filter(Boolean).sort((a,b)=>absStart(a)-absStart(b));
  const lines = [`${myName || "A friend"}'s Lancaster Music Festival plan`];
  let lastDay=-1;
  for (const g of mine){
    if (g.day!==lastDay){ lines.push("", DAYS[g.day].name.toUpperCase()); lastDay=g.day; }
    lines.push(`${hhmm(g.s)} ${g.act}, ${g.area}${g.room?" ("+g.room+")":""}`);
  }
  lines.push("", "Tap to add my picks to your planner:", crewLink());
  lines.push("", "Or open the planner, go to My plan, and paste this whole message under Your crew:");
  lines.push(`LMF26:${encodeURIComponent(myName||"Friend")}:${mine.map(g=>g.id).join(".")}`);
  return lines.join("\n");
}
async function doShare(){
  if (!stars.size){ toast("Star a few things first"); return; }
  const text = shareText();
  try { if (navigator.share){ await navigator.share({text}); return; } } catch(e){ if (e && e.name==="AbortError") return; }
  try { await navigator.clipboard.writeText(text); toast("Copied. Paste it into a message"); return; } catch(e){}
  const ta = document.getElementById("shareOut");
  ta.style.display="block"; ta.value=text; ta.focus(); ta.select();
  toast("Select all and copy");
}
function parseCode(txt){
  const m = String(txt).match(/LMF26:([^:\s]*):([0-9a-f.]*)/i);
  if (!m) return null;
  let name = "Friend"; try { name = decodeURIComponent(m[1]) || "Friend"; } catch(e){}
  return {name, ids: m[2].split(".").filter(id => BY_ID[id])};
}
function addFriend(txt){
  const p = parseCode(txt);
  if (!p){ toast("Couldn't find a plan code in that message"); return false; }
  const i = friends.findIndex(f => f.name.toLowerCase()===p.name.toLowerCase());
  if (i>=0) friends[i]=p; else friends.push(p);
  store.set("friends", friends);
  toast(`Added ${p.name}'s ${p.ids.length} picks`);
  return true;
}

// ---------- calendar export ----------
let downloads = null, dlReady = false;
function icsDate(day, min){
  const d = new Date(startOf(day) + min*60000), p = n => String(n).padStart(2,"0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}T${p(d.getHours())}${p(d.getMinutes())}00`;
}
async function doIcs(){
  if (!stars.size){ toast("Star a few things first"); return; }
  const e = s => String(s).replace(/[\\,;]/g, m=>"\\"+m);
  const ev = [...stars].map(id=>BY_ID[id]).filter(Boolean).map(g => [
    "BEGIN:VEVENT", `UID:${g.id}@lmf26`, `DTSTAMP:20261001T000000Z`,
    `DTSTART;TZID=Europe/London:${icsDate(g.day,g.s)}`, `DTEND;TZID=Europe/London:${icsDate(g.day,g.e)}`,
    `SUMMARY:${e(g.act)}`, `LOCATION:${e(g.area+(g.room?" - "+g.room:"")+", Lancaster")}`,
    `DESCRIPTION:${e((g.desc||"")+(g.url?" Tickets: "+g.url:""))}`, "END:VEVENT"].join("\r\n"));
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//LMF26 planner//EN","CALSCALE:GREGORIAN", ...ev, "END:VCALENDAR"].join("\r\n");
  try { await downloads.save({filename:"lmf-2026-plan.ics", data:ics}); } catch(err){ toast("Calendar file not saved"); }
}

// ---------- toast ----------
let tt;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2200); }

// ---------- events ----------
function toggleStar(id){
  if (stars.has(id)) stars.delete(id); else stars.add(id);
  store.set("stars",[...stars]);
  if (stars.has(id)){
    const c = clashWith(BY_ID[id])[0];
    toast(c ? `Added. Clashes with ${c.act}` : "Added to your plan");
  }
  rerenderKeepScroll();
}
document.addEventListener("click", e => {
  if (e.target.closest("a")) return;
  const op = e.target.closest("[data-open]");
  const b = e.target.closest("button");
  if (b && b.dataset.star){ toggleStar(b.dataset.star); return; }
  if (b && b.dataset.venue){ openVenue(b.dataset.venue, b.dataset.vday!==undefined ? +b.dataset.vday : null); return; }
  if (op){ openSheet(op.dataset.open, !state.sheet); return; }
  if (e.target===scrimEl || (b && "close" in b.dataset)){ closeSheet(); return; }
  if (!b) return;
  if ("changes" in b.dataset){ showChanges(); rerenderKeepScroll(); return; }
  if ("back" in b.dataset){ if (history.state && history.state.view==="venue") history.back(); else { state.view = state.prevView || "venues"; render(); } return; }
  if (b.dataset.vmode){ state.vmode=b.dataset.vmode; store.set("vmode",state.vmode); ttScrollKey=""; render(); return; }
  if (b.dataset.vdaypick){ state.vday=+b.dataset.vdaypick; rerenderKeepScroll(); return; }
  if (b.dataset.vstage!==undefined){ state.vstage=b.dataset.vstage; rerenderKeepScroll(); return; }
  if (b.dataset.day){ ttScrollKey=""; state.day=+b.dataset.day; state.now=false; if (state.view==="list"){ state.q=""; qEl.value=""; document.getElementById("searchWrap").classList.remove("has"); } render(); window.scrollTo(0,0); hdrHidden=false; applyStick(); return; }
  if (b.dataset.filter){ state.filter=b.dataset.filter; render(); return; }
  if ("now" in b.dataset){ state.now=!state.now; render(); window.scrollTo(0,0); hdrHidden=false; applyStick(); return; }
  if ("hidepast" in b.dataset){ state.hidePast=!state.hidePast; render(); return; }
  if (b.dataset.view){
    state.view=b.dataset.view; state.q=""; qEl.value=""; document.getElementById("searchWrap").classList.remove("has");
    render(); window.scrollTo(0,0); hdrHidden=false; applyStick(); return; }
  if ("share" in b.dataset){ doShare(); return; }
  if ("copyplan" in b.dataset){
    if (!stars.size){ toast("Star a few things first"); return; }
    const link = planLink();
    navigator.clipboard.writeText(link).then(() => toast("Plan link copied. Save it in Notes or send it to yourself"), () => {
      const i = document.getElementById("planLinkOut"); i.style.display="block"; i.value=link; i.focus(); i.select(); toast("Select the link and copy it"); });
    return; }
  if ("ics" in b.dataset){ doIcs(); return; }
  if ("cleargone" in b.dataset){ goneStars.length = 0; store.set("stars",[...stars]); render(); return; }
  if ("addfriend" in b.dataset){ if (addFriend(document.getElementById("paste").value)) render(); return; }
  if (b.dataset.rmfriend){ const f=friends.splice(+b.dataset.rmfriend,1)[0]; store.set("friends",friends); toast(`Removed ${f.name}`); render(); return; }
});
document.addEventListener("keydown", e => {
  if (e.key==="Escape" && state.sheet){ closeSheet(); return; }
  if ((e.key==="Enter" || e.key===" ") && e.target.matches && e.target.matches(".b[data-open]")){ e.preventDefault(); openSheet(e.target.dataset.open); }
});
document.addEventListener("input", e => { if (e.target.id==="myName"){ myName=e.target.value.trim(); store.set("name",myName); } });
document.addEventListener("change", e => { if (e.target.id==="crewToggle"){ showCrew=e.target.checked; store.set("showCrew",showCrew); render(); } });
let qt;
const qEl = document.getElementById("q");
qEl.addEventListener("input", () => {
  document.getElementById("searchWrap").classList.toggle("has", !!qEl.value);
  clearTimeout(qt); qt=setTimeout(()=>{ state.q=qEl.value.trim().toLowerCase(); state.now=false; render(); window.scrollTo(0,0); hdrHidden=false; applyStick(); },150);
});
document.getElementById("qClear").addEventListener("click", () => { qEl.value=""; state.q=""; document.getElementById("searchWrap").classList.remove("has"); render(); qEl.focus(); });
window.addEventListener("resize", setHeaderVar);

function readHash(){
  let h = ""; try { h = decodeURIComponent(location.hash.slice(1)); } catch(e){ return; }
  if (!h) return;
  if (h.includes("LMF26")){ addFriend(h); return; }
  let m = h.match(/^p~([0-9a-f.]+)$/i);
  if (m){
    const ids = m[1].split(".").filter(id => BY_ID[id]);
    let n = 0; ids.forEach(id => { if (!stars.has(id)){ stars.add(id); n++; } });
    if (n){ store.set("stars", [...stars]); }
    toast(n ? `Plan restored: ${n} show${n>1?"s":""} added back` : "Your plan is up to date");
    state.view = "plan"; return;
  }
  m = h.match(/^c~([A-Za-z0-9_]{1,30})~([0-9a-f.]*)$/i);
  if (m){
    const name = m[1].replace(/_/g," ").trim() || "Friend";
    const ids = m[2].split(".").filter(id => BY_ID[id]);
    const i = friends.findIndex(f => f.name.toLowerCase()===name.toLowerCase());
    if (i>=0) friends[i] = {name, ids}; else friends.push({name, ids});
    store.set("friends", friends);
    toast(`Added ${name}'s ${ids.length} picks to your crew`);
    state.view = "plan";
  }
}
readHash();
window.addEventListener("hashchange", () => { readHash(); render(); });
history.replaceState({view:"list"}, "");
render();
setInterval(() => { const a=document.activeElement; if (!state.sheet && (!a || !["INPUT","TEXTAREA"].includes(a.tagName))) rerenderKeepScroll(); }, 60000);

if (IN_CLAUDE) initCloud(); else {
  cloudState = "off";
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
(async () => {
  try {
    if (window.claude && window.claude.use){ downloads = await window.claude.use("downloads"); dlReady = !!downloads; if (dlReady && state.view==="plan") render(); }
  } catch(e){}
})();
</script>
